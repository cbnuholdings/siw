<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운영자 콘솔 · SIW 2026 투자상담회</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 운영자 전용 — 20개사를 한 화면에 놓는 것이 목적이다. 밀도를 우선한다. */
:root{
  --cb-primary:#A8134A; --cb-deep:#6E0B2E; --cb-ink:#171214; --cb-body:#5B5155;
  --cb-muted:#8B8085; --cb-paper:#FBF6F7; --cb-line:rgba(23,18,20,.09);
  --siw-navy:#30365B; --ok:#0F7B4F; --warn:#B26B00; --off:#9A8E93;
  --cb-ok:#0F7B4F; --cb-line-brand:rgba(168,19,74,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,'Segoe UI',sans-serif;color:var(--cb-ink);background:#F7F7F9;font-size:14px;line-height:1.6}
.wrap{max-width:1500px;margin:0 auto;padding:0 20px}
h1,h2,h3{margin:0;line-height:1.35}
code,.mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px}

header{background:var(--siw-navy);color:#fff;position:sticky;top:0;z-index:60}
.hd{display:flex;align-items:center;gap:14px;height:60px}
.hd h1{font-size:16px;font-weight:800}
.hd .tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:700}
.hd .grow{flex:1}
.hd button{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.hd button:hover{background:rgba(255,255,255,.22)}

.btn{border:1px solid var(--cb-line);background:#fff;border-radius:7px;padding:7px 13px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--cb-ink)}
.btn:hover{border-color:var(--cb-primary);color:var(--cb-primary)}
.btn.p{background:var(--cb-primary);color:#fff;border-color:var(--cb-primary)}
.btn.p:hover{background:var(--cb-deep);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}

/* 로그인 */
#gate{max-width:400px;margin:80px auto}
.panel{background:#fff;border:1px solid var(--cb-line);border-radius:14px;padding:30px}
.panel h2{font-size:18px;font-weight:800;margin-bottom:6px}
.panel p{margin:0 0 20px;color:var(--cb-body);font-size:13.5px}
input[type=text],input[type=password]{width:100%;padding:11px 13px;border:1px solid var(--cb-line);border-radius:8px;font-family:inherit;font-size:14px;margin-bottom:14px}
input:focus{outline:2px solid rgba(168,19,74,.18);border-color:var(--cb-primary)}
.msg{margin-top:12px;padding:11px 13px;border-radius:8px;font-size:13px;display:none}
.msg.show{display:block}
.msg.err{background:#FDF2F5;color:var(--cb-deep)}
.msg.ok{background:#F0F8F4;color:var(--ok)}

/* 요약 */
#main{display:none;padding:22px 0 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--cb-line);border-radius:11px;padding:15px 17px}
.stat b{display:block;font-size:24px;font-weight:900;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--cb-muted);font-weight:500}
.stat.warn b{color:var(--warn)}
.stat.ok b{color:var(--ok)}

.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bar .grow{flex:1}
.bar input[type=text]{width:220px;margin:0;padding:8px 12px}

/* 표 */
.tablewrap{background:#fff;border:1px solid var(--cb-line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1100px}
th,td{text-align:left;padding:11px 12px;border-top:1px solid var(--cb-line);vertical-align:middle;white-space:nowrap}
/* 🔴 sticky 금지 — .tablewrap 의 overflow-x 와 겹쳐 헤더가 첫 데이터 행을 덮는다(08-28 실측) */
th{background:#FAFAFB;font-size:12px;font-weight:700;color:var(--cb-body);border-top:none}
tbody tr:hover{background:#FCFBFC}
td.item{white-space:normal;max-width:280px;color:var(--cb-body);font-size:12.5px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.g{background:#F0F8F4;color:var(--ok)}
.pill.y{background:#FFF7EA;color:var(--warn)}
.pill.n{background:#F3F1F2;color:var(--off)}
.pill.b{background:#EEF1F8;color:var(--siw-navy)}
.how{font-size:11px;color:var(--cb-muted);margin-left:5px}
.cname{color:var(--cb-primary);font-weight:700;cursor:pointer;text-decoration:none}
.cname:hover{text-decoration:underline}

/* 상세 */
#drawer{position:fixed;top:0;right:0;width:min(760px,94vw);height:100vh;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.14);z-index:80;transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#drawer.open{transform:translateX(0)}
.dh{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--cb-line)}
.dh h2{font-size:16px;font-weight:800}
.dh .grow{flex:1}
.dbody{flex:1;overflow-y:auto;padding:20px 22px 60px}
.dsec{margin-bottom:24px}
.dsec h3{font-size:13px;font-weight:800;color:var(--cb-primary);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--cb-line)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--cb-muted);font-weight:500}
.kv dd{margin:0;word-break:break-word}
.fld{margin-bottom:12px}
.fld .lb{font-size:11.5px;font-weight:700;color:var(--cb-muted);margin-bottom:2px}
.fld .vl{font-size:13px;white-space:pre-wrap;word-break:break-word;background:var(--cb-paper);border-radius:7px;padding:9px 11px}
.rep{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--cb-line);flex-wrap:wrap}
.rep:first-of-type{border-top:none}
#reportBody{font-size:13px;line-height:1.75;background:var(--cb-paper);border-radius:9px;padding:16px;word-break:break-word;max-height:60vh;overflow:auto}
#reportBody .rt{table-layout:fixed}
#reportBody h2{font-size:15px;font-weight:800;margin:20px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--cb-primary)}
#reportBody h2:first-child{margin-top:0}
#reportBody h3{font-size:13.5px;font-weight:800;margin:16px 0 7px;color:var(--cb-deep)}
#reportBody h4{font-size:12.5px;font-weight:800;margin:12px 0 5px;color:var(--cb-body)}
#reportBody p{margin:0 0 9px}
#reportBody ul{margin:0 0 10px;padding-left:18px}
#reportBody li{margin-bottom:3px}
#reportBody hr{border:none;border-top:1px solid var(--cb-line);margin:14px 0}
#reportBody .pdf-pb{display:none}

/* 보고서 표 */
.rt{width:100%;min-width:0;border-collapse:collapse;font-size:11.5px;margin:0 0 12px;background:#fff}
/* 🔴 min-width:0 이 없으면 위의 전역 `table{min-width:1100px}`(목록 표용)을 물려받아
   PDF 캡처(794px)에서 오른쪽 열이 통째로 잘린다(2026-09-01 실측). */
.rt th,.rt td{border:1px solid var(--cb-line);padding:6px 8px;text-align:left;vertical-align:top;
              word-break:break-word;white-space:normal}
/* 🔴 white-space:normal 을 명시해야 한다 — 위의 전역 `th,td{white-space:nowrap}`(목록 표용)이
   보고서 셀에도 걸려 줄바꿈을 막고, 긴 문장이 셀 밖으로 흘러 PDF 에서 잘린다(2026-09-01 실측). */
.rt th{background:var(--cb-paper);font-weight:700}

/* 증거 태그 — 기업이 말한 것과 분석이 추정한 것을 색으로 가른다 */
.tg{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;
    letter-spacing:-.01em;white-space:nowrap;vertical-align:1px}
.tg.t-co{background:#F0F8F4;color:var(--cb-ok);border:1px solid rgba(15,123,79,.24)}      /* 기업입력 */
.tg.t-ex{background:#EEF3FB;color:#2E5AA8;border:1px solid rgba(46,90,168,.24)}           /* 외부확인 */
.tg.t-hy{background:#FDF2F5;color:var(--cb-primary);border:1px solid var(--cb-line-brand)}/* 분석가설 */
.tg.t-ms{background:#F4F2F3;color:var(--cb-muted);border:1px solid var(--cb-line)}        /* 자료 없음 */
.tg.t-rk{background:#FFF7ED;color:#8A5200;border:1px solid rgba(178,107,0,.26)}           /* 핵심 리스크 */

/* PDF 캡처 영역 — A4 폭 794px 고정(96dpi). 화면 스타일과 분리해 둔다 */
#pdfHost{width:794px}
.pdfarea{position:static;width:794px;padding:30px 42px;background:#fff;color:#171214;
         font-family:'Noto Sans KR',sans-serif;font-size:12.5px;line-height:1.75}
.pdfarea h2{font-size:16px;font-weight:800;margin:0 0 12px;padding-bottom:7px;border-bottom:2px solid var(--cb-primary)}
.pdfarea h3{font-size:14px;font-weight:800;margin:16px 0 7px;color:var(--cb-deep)}
.pdfarea h4{font-size:12.5px;font-weight:800;margin:12px 0 5px;color:var(--cb-body)}
.pdfarea p{margin:0 0 9px}
.pdfarea .rt{table-layout:fixed;max-width:100%}
/* 🔴 auto 레이아웃은 긴 한글 셀의 콘텐츠 폭을 존중해 표를 2200px 까지 늘린다 —
   width:100% 도 min-width:0 도 그걸 막지 못한다. fixed 만이 A4 폭 안에 가둔다(실측). */
.pdfarea .rt th{white-space:normal}   /* 🔴 nowrap 이면 표가 A4 폭을 넘어 오른쪽이 잘린다(실측) */
.pdfarea .rt th,.pdfarea .rt td{font-size:11px;padding:5px 7px}
.pdfarea ul{margin:0 0 10px;padding-left:20px}
.pdfarea hr{border:none;border-top:1px solid var(--cb-line);margin:14px 0}
.pdfcover{padding:40px 0 0}
.pdfcover .pc-eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--cb-primary);text-transform:uppercase}
.pdfcover h1{font-size:30px;font-weight:900;letter-spacing:-.03em;margin:12px 0 6px}
.pdfcover .pc-name{font-size:19px;font-weight:800;color:var(--cb-deep);margin-bottom:26px}
.pdfcover .pc-meta{margin-bottom:22px}
.pdfcover .pc-meta th{width:110px}
.pdfcover .pc-legend{font-size:11px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
                     padding:12px 14px;background:var(--cb-paper);border-radius:9px}
.pdfcover .pc-legend b{margin-right:4px;color:var(--cb-body)}
.pdfcover .pc-warn{margin-top:18px;font-size:11.5px;color:var(--cb-deep);
                   background:#FDF2F5;border:1px solid var(--cb-line-brand);border-radius:9px;padding:11px 13px}
.backdrop{position:fixed;inset:0;background:rgba(23,18,20,.28);z-index:70;display:none}
.backdrop.open{display:block}
.empty{padding:24px;text-align:center;color:var(--cb-muted);font-size:13.5px}
.note{font-size:12.5px;color:var(--cb-muted);margin-top:8px}

/* ── 린캔버스 대조 — 기업이 쓴 것과 AI 초안을 색으로 가른다(결정 #34) ── */
.lcbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px}
.lcrow{border-top:1px solid var(--cb-line);padding:11px 0}
.lcrow:first-of-type{border-top:none}
.lchd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lchd .nm{font-size:12.5px;font-weight:800}
.lchd .grow{flex:1}
.lcb{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:-.01em}
.lcb.edited{background:#FDF2F5;color:var(--cb-primary);border:1px solid var(--cb-line-brand)}
.lcb.own{background:#F0F8F4;color:var(--cb-ok);border:1px solid rgba(15,123,79,.22)}
.lcb.ai{background:#F4F2F3;color:var(--cb-muted);border:1px solid var(--cb-line)}
.lcb.empty{background:transparent;color:#B9B1B4;border:1px dashed var(--cb-line)}
.lcv{font-size:12.5px;white-space:pre-wrap;word-break:break-word;border-radius:7px;padding:9px 11px;line-height:1.65}
/* 기업이 쓴 값은 색을 준다. AI 초안은 무채색으로 눌러 둔다 */
.lcv.now-edited{background:#FDF2F5;border-left:3px solid var(--cb-primary)}
.lcv.now-own{background:#F0F8F4;border-left:3px solid var(--cb-ok)}
.lcv.now-ai{background:var(--cb-paper);border-left:3px solid var(--cb-line);color:var(--cb-body)}
.lcv.draft{background:#FAFAFA;border-left:3px dashed #D8D2D4;color:var(--cb-muted);margin-top:6px}
.lcv .cap{display:block;font-size:10.5px;font-weight:800;letter-spacing:.04em;margin-bottom:4px;opacity:.75}
.ops{font-size:12.5px;white-space:pre-wrap;word-break:break-word;background:var(--cb-paper);border-radius:7px;padding:10px 12px;line-height:1.7;margin-bottom:10px}
.ops b{display:block;font-size:11px;font-weight:800;color:var(--cb-muted);letter-spacing:.04em;margin-bottom:3px}
.warnbox{background:#FFF7ED;border:1px solid rgba(178,107,0,.22);color:#8A5200}
.rerun{background:#FDF2F5;color:var(--cb-primary);border:1px solid var(--cb-line-brand);font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <h1>운영자 콘솔</h1>
    <span class="tag">SIW 2026</span>
    <div class="grow"></div>
    <button id="btnFolders" onclick="ensureFolders(this)" style="display:none">📁 자료함 폴더 만들기</button>
    <button id="btnReload" onclick="load()" style="display:none">↻ 새로고침</button>
    <button id="btnOut" onclick="logout()" style="display:none">로그아웃</button>
  </div>
</header>

<div class="wrap">

  <div id="gate">
    <div class="panel">
      <h2>운영자 로그인</h2>
      <p>GAS <code>setup()</code> 실행 시 로그에 찍힌 운영자 코드를 입력하십시오.</p>
      <input type="password" id="fCode" placeholder="운영자 코드" autocomplete="off">
      <button class="btn p" style="width:100%" id="btnIn" onclick="login()">들어가기</button>
      <div class="msg" id="m1"></div>
    </div>
  </div>

  <div id="main">
    <div class="stats" id="stats"></div>

    <div class="bar">
      <input type="text" id="q" placeholder="기업명·대표자·접수번호 검색" oninput="render()">
      <label style="font-size:13px"><input type="checkbox" id="onlyGap" onchange="render()" style="width:auto;margin:0 4px 0 0"> 손이 필요한 곳만</label>
      <div class="grow"></div>
      <span class="note" id="innoState"></span>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>기업</th><th>대표자</th><th>이메일 등록</th><th>접수</th>
          <th>아이템</th><th>업종(KSIC)</th><th>분석</th><th>IR 자료</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="unmatched"></div>
  </div>

</div>

<div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="dh">
    <h2 id="dTitle">상세</h2>
    <div class="grow"></div>
    <button class="btn sm" onclick="closeDrawer()">닫기 ✕</button>
  </div>
  <div class="dbody" id="dBody"></div>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbx5JDTOlItoe2dHxmY5ownhgsot-HssH9eFCGYc84GIW__VNaQfzOgq1C4FptdnHCbn/exec';
var KEY = 'siw2026_admin';
var DATA = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function tok(){ try{ return sessionStorage.getItem(KEY)||''; }catch(e){ return ''; } }
function call(b){
  b.token = b.token || tok();
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(function(r){return r.json();});
}
function say(id,t,k){ var m=$(id); m.textContent=t; m.className='msg show '+(k||'err'); }

/* ── 로그인 ── */
function login(){
  var code = $('fCode').value.trim();
  if(!code) return say('m1','운영자 코드를 입력해 주십시오.');
  $('btnIn').disabled = true; $('btnIn').textContent='확인 중…';
  call({action:'adminLogin', code:code, token:''}).then(function(j){
    $('btnIn').disabled=false; $('btnIn').textContent='들어가기';
    if(!j.ok) return say('m1', j.message||'로그인에 실패했습니다.');
    try{ sessionStorage.setItem(KEY, j.token); }catch(e){}
    open_();
  }).catch(function(){ $('btnIn').disabled=false; $('btnIn').textContent='들어가기'; say('m1','연결에 실패했습니다.'); });
}
function open_(){
  $('gate').style.display='none'; $('main').style.display='block';
  $('btnOut').style.display=''; $('btnReload').style.display=''; $('btnFolders').style.display='';
  load();
}
function logout(){ try{ sessionStorage.removeItem(KEY); }catch(e){} location.reload(); }

/* ── 목록 ── */
function load(){
  $('rows').innerHTML = '<tr><td colspan="9" class="empty">불러오는 중…</td></tr>';
  call({action:'adminList'}).then(function(j){
    if(!j.ok){ if(j.code==='AUTH') return logout(); $('rows').innerHTML='<tr><td colspan="9" class="empty">'+esc(j.message)+'</td></tr>'; return; }
    DATA = j; render();
  }).catch(function(){ $('rows').innerHTML='<tr><td colspan="9" class="empty">연결에 실패했습니다.</td></tr>'; });
}

function render(){
  if(!DATA) return;
  var q = $('q').value.trim().toLowerCase();
  var gapOnly = $('onlyGap').checked;
  var rows = DATA.rows.filter(function(r){
    if(q && (r.company+' '+r.ceo+' '+r.recno+' '+r.email).toLowerCase().indexOf(q)<0) return false;
    if(gapOnly && !(!r.email || !r.recno || !r.folder || r.fileCount===0)) return false;
    return true;
  });

  // 요약
  var all = DATA.rows;
  $('stats').innerHTML =
    stat(all.length,'명단 기업') +
    stat(all.filter(function(r){return r.email;}).length,'가입(이메일 등록)', 'ok') +
    stat(all.filter(function(r){return r.recno;}).length,'접수 완료','ok') +
    stat(all.filter(function(r){return r.reportCount>0;}).length,'분석 있음') +
    stat(all.filter(function(r){return r.fileCount>0;}).length,'IR 자료 전달','ok') +
    stat(all.filter(function(r){return !r.folder;}).length,'폴더 없음', all.some(function(r){return !r.folder;})?'warn':'');

  var w = DATA.window || {};
  $('innoState').innerHTML = DATA.inno
    ? 'INNO 연동 · 전체 접수 '+DATA.innoTotal+'건 중 <b>SIW 구간 '+esc(w.from||'')+' ~ '+esc(w.to||'')+'</b> 만 자동 매칭'+
      (DATA.innoError?' <b style="color:#B26B00">('+esc(DATA.innoError)+')</b>':'')
    : '<b style="color:#B26B00">INNO 미연동</b> — 스크립트 속성 <code>INNO_ADMIN_TOKEN</code> 을 넣으면 신청 내용·분석이 함께 보입니다.';

  if(!rows.length){ $('rows').innerHTML='<tr><td colspan="9" class="empty">해당하는 기업이 없습니다.</td></tr>'; }
  else $('rows').innerHTML = rows.map(rowHTML).join('');

  // INNO 에만 있고 명단에 없는 접수
  var un = DATA.unmatched||[];

function filesSec(j){
  var fs = j.files || [];
  var h = '<div class="dsec"><h3>IR 자료 <span class="note" style="margin:0">— 기업 자료함에 그대로 보이는 파일입니다</span></h3>';
  if(!j.hasFolder){
    h += '<div class="empty">자료함 폴더가 없습니다. 목록 화면의 「자료함 폴더 만들기」를 눌러 주십시오.</div>';
  } else if(!fs.length){
    h += '<div class="empty">아직 올린 자료가 없습니다. 드라이브의 이 기업 폴더에 파일을 넣으면 기업 화면에 바로 나타납니다.</div>';
  } else {
    h += fs.map(function(f){
      return '<div class="rep"><span>'+esc(f.name||'')+'</span>'+
        '<span class="note">'+fmtSize(f.size)+'</span>'+
        '<span class="note">'+esc((f.updated||'').slice(0,10))+'</span>'+
        '<div class="grow" style="flex:1"></div>'+
        '<button class="btn sm" onclick="adminGetFile(&quot;'+esc(j.recno||'')+'&quot;,&quot;'+esc(f.id)+'&quot;,this,&quot;'+esc(DETAIL_PAGE||'')+'&quot;)">내려받기</button>'+
        '</div>';
    }).join('');
  }
  return h + '</div>';
}

function fmtSize(n){
  if(!n && n!==0) return '';
  if(n < 1024) return n+' B';
  if(n < 1048576) return (n/1024).toFixed(0)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}

function adminGetFile(recno, fileId, btn, pageId){
  var t = btn.textContent; btn.disabled = true; btn.textContent = '받는 중…';
  call({action:'adminFile', recno:recno, pageId:pageId||'', fileId:fileId}).then(function(j){
    btn.disabled = false; btn.textContent = t;
    if(!j.ok){ alert(j.message||'내려받지 못했습니다.'); return; }
    var bin = atob(j.data), arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], {type: j.mimeType||'application/octet-stream'}));
    var a = document.createElement('a');
    a.href = url; a.download = j.name || 'file'; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }).catch(function(){ btn.disabled=false; btn.textContent=t; alert('연결에 실패했습니다.'); });
}

/* ══════════════════════════════════════════════════════════════
   마크다운 → HTML  (보고서 본문은 헤더·표·목록·강조만 쓴다)
   증거 태그는 색 배지로 바꾼다 — 기업이 말한 것과 분석이 추정한 것을 눈으로 가른다.
   ══════════════════════════════════════════════════════════════ */
var TAGCLS = {
  '기업입력':'t-co', '외부확인':'t-ex', '분석가설':'t-hy',
  'MISSING':'t-ms', 'MISSING/외부확인 불가':'t-ms', '벤치마크 보완':'t-ms', '핵심 리스크':'t-rk'
};

function inlineMd(s){
  var t = esc(s);
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\[([^\]]{2,24})\]/g, function(m, name){
    var c = TAGCLS[name];
    return c ? '<span class="tg '+c+'">'+name+'</span>' : m;
  });
  return t;
}

function mdToHtml(md){
  var lines = String(md||'').replace(/\r/g,'').split('\n');
  var out = [], i = 0, para = [];

  function flushPara(){
    if(para.length){ out.push('<p>'+para.join('<br>')+'</p>'); para = []; }
  }

  while(i < lines.length){
    var ln = lines[i];

    // 표 — 헤더행 + 구분행 + 본문행
    if(/^\s*\|/.test(ln) && i+1 < lines.length && /^\s*\|[\s\-:|]+\|\s*$/.test(lines[i+1])){
      flushPara();
      var cells = function(row){
        return row.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){ return inlineMd(c.trim()); });
      };
      var head = cells(ln); i += 2;
      var body = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])){ body.push(cells(lines[i])); i++; }
      out.push('<table class="rt"><thead><tr>'+head.map(function(c){return '<th>'+c+'</th>';}).join('')+
        '</tr></thead><tbody>'+body.map(function(r){
          return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';
        }).join('')+'</tbody></table>');
      continue;
    }

    var m;
    if((m = ln.match(/^####\s+(.*)$/))){ flushPara(); out.push('<h4>'+inlineMd(m[1])+'</h4>'); i++; continue; }
    if((m = ln.match(/^###\s+(.*)$/))){  flushPara(); out.push('<h3>'+inlineMd(m[1])+'</h3>'); i++; continue; }
    if((m = ln.match(/^##\s+(.*)$/))){
      flushPara();
      out.push('<div class="pdf-pb"></div><h2>'+inlineMd(m[1])+'</h2>');   // STEP 마다 페이지를 가른다
      i++; continue;
    }
    if((m = ln.match(/^#\s+(.*)$/))){ flushPara(); out.push('<h2>'+inlineMd(m[1])+'</h2>'); i++; continue; }
    if(/^\s*[-*]\s+/.test(ln)){
      flushPara();
      var items = [];
      while(i < lines.length && /^\s*[-*]\s+/.test(lines[i])){
        items.push('<li>'+inlineMd(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>'); i++;
      }
      out.push('<ul>'+items.join('')+'</ul>');
      continue;
    }
    if(/^\s*$/.test(ln)){ flushPara(); i++; continue; }
    if(/^\s*---+\s*$/.test(ln)){ flushPara(); out.push('<hr>'); i++; continue; }
    para.push(inlineMd(ln));
    i++;
  }
  flushPara();
  return out.join('\n');
}

/* ══════════════════════════════════════════════════════════════
   PDF — html2canvas + jsPDF 를 직접 제어한다 (설계정본 결정 #31)
   🔴 html2pdf 번들은 쓰지 않는다. page-break 마커가 무시돼 섹션이 페이지 중간에서 잘린다.
   ══════════════════════════════════════════════════════════════ */
var PDFLIB = { canvas:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
               jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js' };

function loadScript(src){
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = function(){ rej(new Error(src)); };
    document.head.appendChild(s);
  });
}

function ensurePdfLibs(){
  var chain = Promise.resolve();
  if(typeof window.html2canvas === 'undefined') chain = chain.then(function(){ return loadScript(PDFLIB.canvas); });
  if(typeof window.jspdf === 'undefined')       chain = chain.then(function(){ return loadScript(PDFLIB.jspdf); });
  return chain;
}

function kstDate(){
  var d = new Date(Date.now() + 9*3600*1000);   // 서버·브라우저 시간대와 무관하게 한국 날짜로 찍는다
  return d.toISOString().slice(0,10);
}

function coverHtml(j){
  var c = j.cover || {}, co = j.company || {}, r = j.report || {};
  var ks = c.ksic || {};
  var title = $('dTitle').textContent || '';
  return '<div class="pdfcover">'+
    '<div class="pc-eyebrow">SIW 2026 투자상담회 · 상담 데스크용</div>'+
    '<h1>아이템 분석 보고서</h1>'+
    '<div class="pc-name">'+esc(co.company_name || title)+'</div>'+
    '<table class="rt pc-meta"><tbody>'+
      '<tr><th>접수번호</th><td>'+esc(r.recno || co.recno || '')+'</td></tr>'+
      '<tr><th>사업 아이템</th><td>'+esc(c.item || '')+'</td></tr>'+
      '<tr><th>업종(KSIC)</th><td>'+esc([ks.code, ks.name].filter(Boolean).join(' ')+(ks.basis?(' · '+ks.basis):''))+'</td></tr>'+
      '<tr><th>창업 상태</th><td>'+esc(c.stage || '')+'</td></tr>'+
      '<tr><th>판본</th><td>v'+esc(r.version||'')+' · '+esc(j.viewName||'')+' 뷰 · '+esc((r.created_at||'').slice(0,16).replace('T',' '))+'</td></tr>'+
      '<tr><th>출력일</th><td>'+kstDate()+'</td></tr>'+
    '</tbody></table>'+
    '<div class="pc-legend"><b>증거 표기</b>'+
      '<span class="tg t-co">기업입력</span><span class="tg t-ex">외부확인</span>'+
      '<span class="tg t-hy">분석가설</span><span class="tg t-ms">MISSING</span>'+
      '<span class="tg t-rk">핵심 리스크</span></div>'+
    '<p class="pc-warn">본 보고서는 <b>운영자 전용</b>입니다. 기업에게 전달하지 않습니다.</p>'+
  '</div>';
}

function downloadPdf(){
  if(!REPORT){ return; }
  var msg = $('pdfMsg');
  msg.textContent = 'PDF를 만드는 중입니다… 잠시만 기다려 주십시오.';
  ensurePdfLibs().then(function(){
    return renderPdf(REPORT);
  }).then(function(name){
    msg.textContent = '내려받았습니다 — ' + name;
  }).catch(function(e){
    msg.textContent = 'PDF를 만들지 못했습니다: ' + (e && e.message ? e.message : e);
  });
}

function renderPdf(j, mode){          // mode: save(기본) · blob · datauristring — 뒤에 제출 연동에도 쓴다
  // 화면 밖 고정 host + 정상 흐름 자식에서 캡처한다(오프스크린 높이 0 측정 회피)
  var host = $('pdfHost');
  if(!host){
    host = document.createElement('div'); host.id = 'pdfHost';
    document.body.appendChild(host);
  }
  host.style.cssText = 'position:fixed;left:0;top:0;z-index:-1;opacity:0;pointer-events:none;width:794px;background:#fff;overflow:hidden';
  host.innerHTML = '<div id="pdfArea"></div>';
  var area = $('pdfArea');
  area.className = 'pdfarea';

  var parts = (coverHtml(j) + '\n' + mdToHtml(j.body||'')).split('<div class="pdf-pb"></div>')
                .filter(function(s){ return s.replace(/\s|<[^>]*>/g,'').length; });

  var jsPDF = window.jspdf.jsPDF;
  var pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
  var PW=210, PH=297, M=10, availW=PW-2*M, availH=PH-2*M;

  var chain = Promise.resolve();
  parts.forEach(function(html, idx){
    chain = chain.then(function(){
      area.innerHTML = html;
      return window.html2canvas(area, {scale:2, useCORS:true, backgroundColor:'#ffffff',
        width:794, windowWidth:794, scrollX:0, scrollY:0});
    }).then(function(canvas){
      var img = canvas.toDataURL('image/jpeg', 0.95);
      var imgH = canvas.height * availW / canvas.width;
      if(idx > 0) pdf.addPage();
      if(imgH <= availH){ pdf.addImage(img, 'JPEG', M, M, availW, imgH); }
      else {
        var left = imgH, first = true;
        while(left > 0){
          if(!first) pdf.addPage();
          pdf.addImage(img, 'JPEG', M, M-(imgH-left), availW, imgH);   // 페이지 경계가 자연 클리핑
          left -= availH; first = false;
        }
      }
    });
  });

  return chain.then(function(){
    var co = (j.company||{}).company_name || '기업';
    var rn = (j.report||{}).recno || '';
    var name = '아이템분석_' + co + (rn?('_'+rn):'') + '.pdf';
    host.innerHTML = '';
    if(mode === 'blob') return pdf.output('blob');
    if(mode === 'datauristring') return pdf.output('datauristring');
    pdf.save(name);
    return name;
  });
}

}
